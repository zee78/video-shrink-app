plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videoprocessor'
version = '0.1.0'

android {
  namespace "expo.modules.videoprocessor"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// Android Media3 dependencies for video compression
dependencies {
  implementation "androidx.media3:media3-transformer:1.11.1"
  implementation "androidx.media3:media3-effect:1.11.1"
  implementation "androidx.media3:media3-common:1.11.1"
}
